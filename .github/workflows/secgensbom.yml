name: SecGenSBOM

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  IMAGE_NAME: secgensbom-sca

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_saved: ${{ steps.save-image.outputs.saved }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        if: ${{ env.DOCKER_REGISTRY != '' && secrets.DOCKER_USER != '' }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME:${{ steps.vars.outputs.short_sha }}" -f resolve/SCA.Dockerfile .

      - name: Tag & push to registry
        if: ${{ env.DOCKER_REGISTRY != '' && secrets.DOCKER_USER != '' }}
        run: |
          FULL_TAG="${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/$IMAGE_NAME:${{ steps.vars.outputs.short_sha }}"
          docker tag "$IMAGE_NAME:${{ steps.vars.outputs.short_sha }}" "$FULL_TAG"
          docker push "$FULL_TAG"

      - name: Save image as artifact when registry not configured
        id: save-image
        if: ${{ env.DOCKER_REGISTRY == '' }}
        run: |
          docker save "$IMAGE_NAME:${{ steps.vars.outputs.short_sha }}" -o secgensbom-sca.tar
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - name: Upload image artifact
        if: ${{ steps.save-image.outputs.saved == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: secgensbom-sca-image
          path: secgensbom-sca.tar

  run-pipeline:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact if present
        id: download
        if: ${{ needs.build-and-push.outputs.image_saved == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: secgensbom-sca-image

      - name: Load image if tar exists
        run: |
          if [ -f secgensbom-sca.tar ]; then docker load -i secgensbom-sca.tar; fi

      - name: Run pipeline
        run: |
          chmod +x secgensbom/pipeline.sh
          ./secgensbom/pipeline.sh "$GITHUB_WORKSPACE"
